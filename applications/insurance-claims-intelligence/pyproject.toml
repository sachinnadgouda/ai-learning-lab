[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insurance-claims-intelligence"
version = "1.0.0"
description = "Evidence-backed insurance claims document intelligence, hybrid retrieval, deterministic risk triage, and human-in-the-loop review governance."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.6,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.3,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "sqlalchemy>=2.0.36,<3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "pillow>=11.0.0,<12.0.0",
    "httpx>=0.28.1,<1.0.0",
    "python-multipart>=0.0.20,<1.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.3,<4.0.0",
]
dev = [
    "pytest>=8.3.4,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.4,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[project.scripts]
claims-intel = "claims_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_intel"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
