services:
  auditor:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/software-architecture-auditor:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      AUDITOR_HOST: "0.0.0.0"
      AUDITOR_PORT: "8083"
      AUDITOR_DB_PATH: "/data/auditor.db"
      AUDITOR_ALLOWED_ROOTS: "/repositories"
      AUDITOR_API_KEY: "${AUDITOR_API_KEY:-change-me-local-dev-api-key-123456}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_BASE_URL: "${AI_BASE_URL:-http://ollama:11434}"
      AI_MODEL: "${AI_MODEL:-llama3.2:3b}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AUDITOR_LOG_LEVEL: "${AUDITOR_LOG_LEVEL:-INFO}"
    volumes:
      - auditor-data:/data
      - ./examples:/repositories/examples:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:0.6.5
    profiles:
      - ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  auditor-data:
  ollama-models:
