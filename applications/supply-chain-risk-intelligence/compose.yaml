services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--seed"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "/data/supply_chain.db"
      EVENT_BROKER: "${EVENT_BROKER:-redis}"
      REDIS_ADDR: "redis:6379"
      REDIS_STREAM: "${REDIS_STREAM:-supply-chain-events}"
      REDIS_GROUP: "${REDIS_GROUP:-risk-workers}"
      QUEUE_CAPACITY: "${QUEUE_CAPACITY:-256}"
      WORKER_COUNT: "${WORKER_COUNT:-4}"
      MAX_RETRIES: "${MAX_RETRIES:-3}"
      AI_PROVIDER: "${AI_PROVIDER:-none}"
      AI_BASE_URL: "${AI_BASE_URL:-http://ollama:11434}"
      AI_MODEL: "${AI_MODEL:-llama3.2:1b}"
      AI_API_KEY: "${AI_API_KEY:-}"
      API_KEY_OPERATOR: "${API_KEY_OPERATOR:-dev-operator-key}"
      API_KEY_APPROVER: "${API_KEY_APPROVER:-dev-approver-key}"
      API_KEY_ADMIN: "${API_KEY_ADMIN:-dev-admin-key}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - supply_chain_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.2
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  supply_chain_data:
  redis_data:
  ollama_data:
