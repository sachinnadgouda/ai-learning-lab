name: supply-chain-risk-intelligence

on:
  push:
    paths:
      - "applications/supply-chain-risk-intelligence/**"
      - ".github/workflows/supply-chain-risk-intelligence.yml"
  pull_request:
    paths:
      - "applications/supply-chain-risk-intelligence/**"
      - ".github/workflows/supply-chain-risk-intelligence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_ADDR: 127.0.0.1:6379
    defaults:
      run:
        working-directory: applications/supply-chain-risk-intelligence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: applications/supply-chain-risk-intelligence/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run unit, concurrency, integration, and eval tests with -race
        run: go test -race -count=1 ./...

      - name: Build server and simulator binaries
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/simulator
