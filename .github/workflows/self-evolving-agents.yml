name: self-evolving-agents

on:
  push:
    paths: ["self-evolving-agents/**", ".github/workflows/self-evolving-agents.yml"]
  pull_request:
    paths: ["self-evolving-agents/**", ".github/workflows/self-evolving-agents.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: self-evolving-agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: self-evolving-agents/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: self-evolving-agents/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watch=false
      - run: npm run build
